name: e2e (release browsers)
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    # Edge shares Chrome's dist/ build and Firefox changes far less often than the
    # shared code the Chrome job covers on every PR, so these only earn their CI
    # minutes at release time. github.head_ref is empty on workflow_dispatch, hence
    # the first clause.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: edge
            playwright: msedge
          - browser: firefox
            playwright: firefox

    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nodeModules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            nodeModules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.playwright }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.playwright }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.playwright }}

      - name: Run e2e tests
        run: yarn e2e --${{ matrix.browser }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
