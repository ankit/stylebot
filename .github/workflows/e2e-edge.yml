name: e2e (edge)
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-edge:
    name: e2e (edge)
    # Edge uses the same dist/ build as Chrome, so it only earns its CI minutes at
    # release time. github.head_ref is empty on workflow_dispatch, hence the first clause.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nodeModules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            nodeModules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-msedge-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Edge
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps msedge

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps msedge

      - name: Run e2e tests
        run: yarn test:e2e:edge

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-edge
          path: playwright-report/
          retention-days: 14
