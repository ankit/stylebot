name: bundle size
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest

    steps:
      # Two commits: the PR merged into its base, and that base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nodeModules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            nodeModules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Measure PR
        run: |
          yarn build
          cp scripts/bundle-size.mjs "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/bundle-size.mjs" measure dist > "$RUNNER_TEMP/head.json"

      # Built in the same directory as the PR so path-derived output matches.
      - name: Measure base
        run: |
          head_sha=$(git rev-parse HEAD)
          git checkout --force --detach HEAD^1
          if ! git diff --quiet "$head_sha" HEAD -- yarn.lock patches; then
            yarn install --frozen-lockfile
          fi
          rm -rf dist
          yarn build
          node "$RUNNER_TEMP/bundle-size.mjs" measure dist > "$RUNNER_TEMP/base.json"

      - name: Compare
        id: compare
        run: |
          node "$RUNNER_TEMP/bundle-size.mjs" report "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so they only get the job summary.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- bundle-size-report -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -F body=@"$RUNNER_TEMP/report.md" > /dev/null
          elif [ "$CHANGED" = "true" ]; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/report.md" > /dev/null
          fi
