<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <script src="theme-init.js"></script>
    <style>
      @font-face {
        font-family: 'Fira Code';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../../fonts/fira-code-400.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Fira Code';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('../../fonts/fira-code-500.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Fira Code';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('../../fonts/fira-code-600.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        background: #fcfcfd;
      }

      html.theme-dark,
      html.theme-dark body {
        background: #1a1b1e;
      }

      #container {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        position: fixed;
      }
    </style>
  </head>

  <body>
    <div id="container"></div>

    <!-- Injected dynamically by build process -->
    <script defer src="./node_modules/monaco-editor/min/vs/loader.js"></script>
    <!-- Injected dynamically by build process -->
    <script defer src="./node_modules/requirejs/require.js"></script>

    <script defer src="index.js"></script>
  </body>
</html>
