<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <script src="theme-init.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #fcfcfd;
      }

      html.theme-dark,
      html.theme-dark body {
        background: #1a1b1e;
      }

      #container {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        position: fixed;
      }
    </style>
  </head>

  <body>
    <div id="container"></div>

    <!-- Injected dynamically by build process -->
    <script defer src="./node_modules/monaco-editor/min/vs/loader.js"></script>
    <!-- Injected dynamically by build process -->
    <script defer src="./node_modules/requirejs/require.js"></script>

    <script defer src="options-index.js"></script>
  </body>
</html>
